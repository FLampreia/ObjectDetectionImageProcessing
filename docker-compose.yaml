services:
  worker:
    build:
      context: .
      additional_contexts:
        wheels: ./docker/wheels
    restart: unless-stopped
    ports:
      - "${WORKER_BIND_HOST:-127.0.0.1}:${WORKER_PORT:-8001}:8001"
    volumes:
      - worker_models:/app/app/yolo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  worker_models:
